name: Desktop independent checks
on: [push, pull_request, workflow_dispatch]
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run build
      - run: npm.cmd run format:check
