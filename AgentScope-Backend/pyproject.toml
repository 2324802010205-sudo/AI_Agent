[project]
name = "agentscope-backend"
version = "0.2.1"
description = "Local, observable and policy-enforced AgentScope runtime"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "python-multipart>=0.0.20", "pydantic>=2.10,<3", "PyYAML>=6.0.2", "openpyxl>=3.1.5", "xlrd>=2.0.1", "httpx>=0.28,<1", "keyring>=25.6", "websockets>=14"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pyinstaller>=6.12", "black>=26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.test-tmp -o cache_dir=.pytest_cache-local"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentscope*"]

[tool.setuptools.package-data]
"agentscope.experiments" = ["mcp_server.py"]
"agentscope.lab.containment" = ["*.cs", "*.xlsx", "phase4_mcp.py", "skill-lifecycle-audit.json", "format-sessions.json", "fixtures/*/SKILL.md", "fixtures/*/*.xlsx"]
